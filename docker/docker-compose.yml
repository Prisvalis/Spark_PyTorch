version: "3.9"

services:
  pytorch-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    env_file:
      - ../.env
    volumes:
      - ./data:/workspace/data   # optional persistent data folder
    command: ["bash"]